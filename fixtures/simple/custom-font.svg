      height: 1em;
      overflow: visible;
      vertical-align: -0.125em;
    }
    #mermaid-0 .node .label-icon path {
      fill: currentColor;
      stroke: revert;
      stroke-width: revert;
    }
    #mermaid-0 :root {
      --mermaid-font-family: 'Irish Grover';
